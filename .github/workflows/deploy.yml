name: Build and deploy songbook

permissions:
  contents: write # push the "latest" tag and its GitHub release
  packages: write # push the toolchain image to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'script/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

# A newer push supersedes any in-flight run
concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No-op when the Dockerfile is unchanged (all layers come from the registry cache)
      - name: Build and push toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:toolchain
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:toolchain
          cache-to: type=inline

      - name: Build PDFs (A4 + A5)
        run: docker run --rm -v "$PWD:/songbook" ghcr.io/${{ github.repository }}:toolchain all --custom-sort

      - name: Compute build timestamp
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Publish PDFs to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Songbook ${{ env.BUILD_DATE }}
          body: Automated build of ${{ github.sha }} from ${{ env.BUILD_DATE }}.
          make_latest: true
          files: |
            release/songbook.pdf
            release/songbook_A4.pdf

      - name: Copy A5 release file to server
        uses: appleboy/scp-action@v1.0.0
        with:
          source: "./release/songbook.pdf"
          target: ${{ secrets.SSH_SERVER_PATH }}
          host: ${{ secrets.SSH_SERVER_HOST }}
          port: ${{ secrets.SSH_SERVER_PORT }}
          username: ${{ secrets.SSH_SERVER_USER }}
          key: ${{ secrets.SSH_SERVER_KEY }}
          passphrase: ${{ secrets.SSH_SERVER_PASSPHRASE }}
          strip_components: 2
          overwrite: true
      - name: Copy A4 release file to server
        uses: appleboy/scp-action@v1.0.0
        with:
          source: "./release/songbook_A4.pdf"
          target: ${{ secrets.SSH_SERVER_PATH }}
          host: ${{ secrets.SSH_SERVER_HOST }}
          port: ${{ secrets.SSH_SERVER_PORT }}
          username: ${{ secrets.SSH_SERVER_USER }}
          key: ${{ secrets.SSH_SERVER_KEY }}
          passphrase: ${{ secrets.SSH_SERVER_PASSPHRASE }}
          strip_components: 2
          overwrite: true
